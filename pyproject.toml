[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfeishu"
version = "0.1.0"
description = "飞书文档快速操作API - 飞书（Lark）Sheets API v3 的高级 Python 封装"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "jibuzixin", email = "this.jibuzixin@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 核心依赖：仅保留表格读写必需的轻量库（约 4MB）
# pandas / Pillow / aiohttp 已下沉为可选依赖，按需安装对应 extras
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "yarl>=1.9.0",
    "pydantic_settings>=2.0.0",
]

[project.optional-dependencies]
# 图片压缩功能：download_image_base64(compress=...) 使用
image = ["Pillow>=10.0.0"]
# 批量异步下载图片：utils.common.batch_download_images 使用
download = ["aiohttp>=3.9.0"]
# 一次性装齐全部可选功能
all = ["fastfeishu[image,download]"]

[project.urls]
Homepage = "https://github.com/jibuzixin/fastfeishu"

[tool.setuptools.packages.find]
include = ["fastfeishu", "fastfeishu.*"]

[tool.setuptools.package-data]
fastfeishu = ["configs/*.yaml"]
