name: Deploy Docs

# 手动触发 / 推送到 main 时，把 site/ 发布到 GitHub Pages
# 首次使用：仓库 Settings → Pages → Source 选择 "GitHub Actions"

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - 'tools/build_docs_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装文档构建依赖
      run: pip install markdown-it-py Pygments

    - name: 构建文档站点
      run: python tools/build_docs_site.py

    - name: 上传 Pages 制品
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - name: 发布到 GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v4
